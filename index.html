<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ValidaAe</title>
</head>
<body>
    <div>
        <h1 align="center">ValidaAe</h1>
    </div>

    <h2>ValidaAe - Sistema de Validação de dados</h2>
    <p class="lead">Arquivos suportados: CSV, JSON, XML</p>

    <div class="drop-zone" id="dropZone"> <!-- Área para drop de arquivos -->
        <span class="drop-zone__prompt">Arraste e solte o arquivo aqui ou <strong>Clique</strong></span>
        <input type="file" name="arquivo" id="fileInput" class="drop-zone__input"> <!-- Input da seleção de arquivo -->
    </div>
    <div id="fileInfo"></div>

    <script src="js/app.js"></script>

</body>
</html>
